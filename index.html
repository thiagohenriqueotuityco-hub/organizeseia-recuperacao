<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organize-se IA — Recuperar senha</title>
<style>
:root{--bg:#071116;--panel:#0d1b23;--line:#1b3540;--text:#f4f8f9;--muted:#8ea6b0;--green:#25ef6b;--red:#ff7378}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#12303a 0,#071116 42%,#061016 100%);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:linear-gradient(180deg,#11252f,#0d1b23);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 12px 32px rgba(0,0,0,.25)}.brand{font-size:28px;font-weight:900}.brand span{color:var(--green)}h1{font-size:21px;margin:18px 0 6px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.field{margin-top:16px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input{width:100%;background:#07151c;color:#fff;border:1px solid #24404c;border-radius:12px;padding:13px;outline:none}.field input:focus{border-color:var(--green)}button{width:100%;border:0;border-radius:13px;padding:13px 16px;font-weight:800;cursor:pointer;margin-top:14px}.primary{background:var(--green);color:#031009}.notice{margin-top:14px;padding:12px;border-radius:12px;background:#102d39;border:1px solid #1f5364;color:#cde5ed;font-size:13px}.error{background:#351c21;border-color:#613038;color:#ffb4b7}.ok{background:#0e3325;border-color:#267b4e;color:#d9ffe7}.hidden{display:none}.spinner{opacity:.7}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Organize-se <span>IA</span></div>
  <div id="loading"><h1>Verificando seu link…</h1><div class="muted">Aguarde enquanto preparamos a recuperação da sua senha.</div></div>
  <form id="form" class="hidden">
    <h1>Crie uma nova senha</h1>
    <div class="muted">Escolha uma nova senha para sua conta do Organize-se IA.</div>
    <div class="field"><label>Nova senha</label><input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="Mínimo de 6 caracteres"></div>
    <div class="field"><label>Confirmar nova senha</label><input id="confirm" type="password" minlength="6" autocomplete="new-password" required placeholder="Digite novamente"></div>
    <button class="primary" type="submit">SALVAR NOVA SENHA</button>
  </form>
  <div id="message" class="notice hidden"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ocaetekjwezqhcqszbko.supabase.co';
const params=new URLSearchParams(location.search);
const key=params.get('key')||'';
const msg=document.getElementById('message');
function message(text,type=''){msg.textContent=text;msg.className='notice '+type;msg.classList.remove('hidden')}
async function init(){
  try{
    if(!key) throw new Error('Link de recuperação incompleto. Solicite um novo e-mail.');
    const sb=supabase.createClient(SUPABASE_URL,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const hash=new URLSearchParams(location.hash.replace(/^#/,''));
    const access=hash.get('access_token'), refresh=hash.get('refresh_token');
    if(access&&refresh){const r=await sb.auth.setSession({access_token:access,refresh_token:refresh});if(r.error)throw r.error}
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    if(!data.session) throw new Error('Este link expirou ou já foi utilizado. Solicite um novo link.');
    document.getElementById('loading').classList.add('hidden');document.getElementById('form').classList.remove('hidden');
    document.getElementById('form').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p!==c){message('As senhas não conferem.','error');return}const btn=e.target.querySelector('button');btn.disabled=true;btn.classList.add('spinner');try{const r=await sb.auth.updateUser({password:p});if(r.error)throw r.error;document.getElementById('form').classList.add('hidden');message('Senha alterada com sucesso! Agora abra o Organize-se IA e entre com sua nova senha.','ok')}catch(err){message(err.message||'Não foi possível alterar a senha.','error')}finally{btn.disabled=false;btn.classList.remove('spinner')}}
  }catch(err){document.getElementById('loading').classList.add('hidden');message(err.message||'Não foi possível validar o link.','error')}
}
init();
</script>
</body>
</html>
